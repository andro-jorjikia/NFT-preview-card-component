<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>NFT preview card component</title>
</head>
<body>  
</body>
    <div class="container">
        <div class="card">
            <div class="card-image">
                <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT">
                <div class="overlay">
                    <img src="images/icon-view.svg" alt="View Icon" class="view-icon">
                </div>
            </div>
            <h2 class="card-title">Equilibrium #3429</h2>
            <p class="card-desc">Our Equilibrium collection promotes balance and calm.</p>
            <div class="card-info">
                <div class="price">
                    <img src="images/icon-ethereum.svg" alt="ETH" class="eth-icon">
                    <span>0.041 ETH</span>
                </div>
                <div class="time">
                    <img src="images/icon-clock.svg" alt="Clock" class="clock-icon">
                    <span>3 days left</span>
                </div>
            </div>
            <div class="card-footer">
                <img src="images/image-avatar.png" alt="Avatar" class="avatar">
                <span>Creation of <a href="#">Jules Wyvern</a></span>
            </div>
        </div>
    </div>
</body>
</html>
